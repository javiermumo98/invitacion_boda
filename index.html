document.addEventListener('DOMContentLoaded', async function() {

  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }

      } catch (err) {

        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {

    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {

        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

rc: url(\"be7f868a-d838-4282-8777-9a39a6425b6f\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Parisienne';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"583fdec4-8d74-4781-a490-71d77eb03f9c\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n\n<style>\n  :root {\n    --bg: #fbfaf6;\n    --bg-2: #f3f0e8;\n    --ink: #1a1a1a;\n    --ink-soft: #3a3a38;\n    --muted: #8a8a82;\n    --line: #d9d6cc;\n    --leaf: #9fa987;        /* verde salvia */\n    --leaf-deep: #6d7a58;\n    --gold: #b69a64;\n    --accent: var(--leaf);\n    --serif: 'Cormorant Garamond', 'Cormorant', Georgia, serif;\n    --script: 'Parisienne', 'Dancing Script', cursive;\n    --mono: ui-monospace, 'SF Mono', Menlo, monospace;\n  }\n  [data-theme=\"dark\"] {\n    --bg: #1b1c18;\n    --bg-2: #24251f;\n    --ink: #f2efe6;\n    --ink-soft: #d9d5c7;\n    --muted: #8d8c82;\n    --line: #3a3a33;\n  }\n  [data-script=\"dancing\"] { --script: 'Dancing Script', cursive; }\n  [data-script=\"vibes\"]   { --script: 'Great Vibes', cursive; }\n\n  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }\n  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: var(--serif); }\n  body { font-size: 17px; line-height: 1.5; overflow-x: hidden; }\n  img { display: block; max-width: 100%; }\n  a { color: inherit; }\n  button { font-family: inherit; cursor: pointer; }\n\n  .page {\n    max-width: 480px;\n    margin: 0 auto;\n    background: var(--bg);\n    position: relative;\n    overflow: hidden;\n    min-height: 100vh;\n  }\n\n  /* ============ COVER ============ */\n  .cover {\n    position: fixed;\n    inset: 0;\n    z-index: 50;\n    background: var(--bg);\n    display: flex; align-items: center; justify-content: center;\n    transition: transform 1.2s cubic-bezier(.76,0,.24,1), opacity .6s ease .6s;\n  }\n  .cover.open { transform: translateY(-100%); opacity: 0; pointer-events: none; }\n  .cover-inner {\n    max-width: 480px; width: 100%; height: 100%;\n    position: relative;\n    display: flex; flex-direction: column; align-items: center; justify-content: center;\n    padding: 40px 28px;\n    text-align: center;\n  }\n  .cover .leaves { position: absolute; inset: 0; pointer-events: none; }\n  .cover .leaf-corner { position: absolute; opacity: 0; animation: leafIn 1.6s cubic-bezier(.22,.8,.3,1) forwards; }\n  .cover .leaf-corner.tl { top: -10px; left: -20px; width: 58%; animation-delay: .1s; }\n  .cover .leaf-corner.tr { top: 20px; right: -30px; width: 48%; transform: scaleX(-1); animation-delay: .3s; }\n  .cover .leaf-corner.bl { bottom: -10px; left: -20px; width: 42%; transform: scaleY(-1); animation-delay: .5s; }\n  .cover .leaf-corner.br { bottom: 20px; right: -10px; width: 44%; transform: scale(-1,-1); animation-delay: .7s; }\n\n  .cover .meta {\n    font-family: var(--serif);\n    letter-spacing: .35em;\n    text-transform: uppercase;\n    font-size: 11px;\n    color: var(--muted);\n    opacity: 0; animation: fadeUp .9s ease .9s forwards;\n  }\n  .cover .names {\n    font-family: var(--script);\n    font-size: clamp(46px, 13vw, 72px);\n    line-height: 1.25;\n    color: var(--ink);\n    margin: 18px 0 0;\n    font-weight: 400;\n    padding-bottom: .35em;\n  }\n  .cover .names .line1 { display: block; opacity: 0; animation: fadeUp 1.2s ease 1.2s forwards; padding-bottom: .2em; }\n  .cover .names .line2 { display: block; opacity: 0; animation: fadeUp 1.2s ease 1.5s forwards; padding-bottom: .35em; }\n  .cover .ampersand { display: inline-block; font-style: italic; }\n  .cover .date {\n    margin-top: 64px;\n    font-family: var(--serif);\n    letter-spacing: .3em;\n    font-size: 14px;\n    color: var(--ink-soft);\n    opacity: 0; animation: fadeUp .9s ease 1.9s forwards;\n  }\n  .cover .hint {\n    position: absolute;\n    bottom: 42px; left: 0; right: 0;\n    text-align: center;\n    font-family: var(--serif);\n    font-size: 12px;\n    letter-spacing: .25em;\n    text-transform: uppercase;\n    color: var(--muted);\n    opacity: 0; animation: fadeUp .9s ease 2.3s forwards, bob 2.6s ease-in-out 3.2s infinite;\n  }\n  .cover .open-btn {\n    margin-top: 36px;\n    border: 1px solid var(--ink);\n    background: transparent;\n    color: var(--ink);\n    padding: 14px 28px;\n    font-family: var(--serif);\n    font-size: 13px;\n    letter-spacing: .3em;\n    text-transform: uppercase;\n    border-radius: 0;\n    opacity: 0; animation: fadeUp .9s ease 2.1s forwards;\n    transition: background .2s, color .2s;\n  }\n  .cover .open-btn:hover, .cover .open-btn:active { background: var(--ink); color: var(--bg); }\n\n  @keyframes leafIn {\n    from { opacity: 0; transform: translate(var(--tx,0), 20px) var(--base-tf, none); filter: blur(6px); }\n    to   { opacity: .95; transform: translate(0,0) var(--base-tf, none); filter: blur(0); }\n  }\n  .cover .leaf-corner.tr { --base-tf: scaleX(-1); }\n  .cover .leaf-corner.bl { --base-tf: scaleY(-1); }\n  .cover .leaf-corner.br { --base-tf: scale(-1,-1); }\n\n  @keyframes fadeUp {\n    from { opacity: 0; transform: translateY(14px); }\n    to   { opacity: 1; transform: translateY(0); }\n  }\n  @keyframes bob {\n    0%, 100% { transform: translateY(0); }\n    50%      { transform: translateY(6px); }\n  }\n\n  /* ============ SECTIONS ============ */\n  section.block {\n    position: relative;\n    padding: 56px 28px;\n    text-align: center;\n    border-bottom: 1px solid var(--line);\n  }\n  section.block:last-of-type { border-bottom: none; }\n  .overline {\n    font-size: 10.5px;\n    letter-spacing: .45em;\n    text-transform: uppercase;\n    color: var(--muted);\n    margin-bottom: 22px;\n    font-family: var(--serif);\n  }\n  h2.title {\n    font-family: var(--script);\n    font-weight: 400;\n    font-size: 44px;\n    line-height: 1;\n    margin: 0 0 10px;\n  }\n  .kicker {\n    font-family: var(--serif);\n    letter-spacing: .3em;\n    font-size: 13px;\n    text-transform: uppercase;\n    color: var(--ink-soft);\n  }\n  .body-text {\n    font-family: var(--serif);\n    font-size: 18px;\n    line-height: 1.55;\n    color: var(--ink-soft);\n    max-width: 380px;\n    margin: 18px auto 0;\n    text-wrap: pretty;\n  }\n  .divider {\n    display: flex; align-items: center; justify-content: center; gap: 12px;\n    margin: 28px auto;\n    color: var(--leaf);\n  }\n  .divider::before, .divider::after {\n    content: ''; height: 1px; background: var(--line); flex: 1; max-width: 70px;\n  }\n  .divider svg { width: 18px; height: 18px; }\n\n  /* Welcome block (reproduces the PDF) */\n  .welcome .names-big {\n    font-family: var(--script);\n    font-size: clamp(48px, 14vw, 72px);\n    line-height: 1;\n    margin: 10px 0 36px;\n  }\n  .welcome .intro {\n    font-family: var(--serif);\n    font-size: 17px;\n    line-height: 1.55;\n    color: var(--ink-soft);\n    max-width: 380px;\n    margin: 0 auto 28px;\n  }\n  .welcome .date-big {\n    font-family: var(--serif);\n    letter-spacing: .35em;\n    font-size: 22px;\n    margin: 10px 0 32px;\n    color: var(--ink);\n  }\n  .welcome .date-big .dot { color: var(--leaf); margin: 0 .2em; }\n  .welcome .places {\n    font-family: var(--serif);\n    font-size: 16px;\n    line-height: 1.7;\n    color: var(--ink-soft);\n    max-width: 380px; margin: 0 auto;\n  }\n  .welcome .sign {\n    margin-top: 34px;\n    font-family: var(--script);\n    font-size: 26px;\n    color: var(--ink);\n  }\n\n  /* Countdown */\n  .countdown {\n    background: var(--bg-2);\n  }\n  .count-grid {\n    display: grid;\n    grid-template-columns: repeat(4, 1fr);\n    gap: 10px;\n    max-width: 380px;\n    margin: 8px auto 0;\n  }\n  .count-cell {\n    background: var(--bg);\n    border: 1px solid var(--line);\n    padding: 18px 6px 14px;\n    display: flex; flex-direction: column; align-items: center; gap: 6px;\n  }\n  .count-num {\n    font-family: var(--serif);\n    font-size: 34px;\n    line-height: 1;\n    color: var(--ink);\n    font-variant-numeric: tabular-nums;\n  }\n  .count-lab {\n    font-size: 10px;\n    letter-spacing: .25em;\n    text-transform: uppercase;\n    color: var(--muted);\n  }\n\n  /* Venues */\n  .venue {\n    display: flex; flex-direction: column; align-items: center;\n  }\n  .venue .time {\n    font-family: var(--serif);\n    font-size: 22px;\n    letter-spacing: .15em;\n    color: var(--ink);\n    margin: 6px 0 14px;\n  }\n  .venue .name {\n    font-family: var(--serif);\n    font-style: italic;\n    font-size: 22px;\n    color: var(--ink);\n    margin: 0;\n    max-width: 340px;\n  }\n  .venue .addr {\n    font-family: var(--serif);\n    font-size: 15px;\n    color: var(--ink-soft);\n    margin: 8px 0 22px;\n  }\n  .venue .map-btn {\n    display: inline-block;\n    border: 1px solid var(--ink);\n    color: var(--ink);\n    background: transparent;\n    padding: 12px 22px;\n    text-decoration: none;\n    font-family: var(--serif);\n    font-size: 12px;\n    letter-spacing: .3em;\n    text-transform: uppercase;\n    transition: background .2s, color .2s;\n  }\n  .venue .map-btn:hover { background: var(--ink); color: var(--bg); }\n  .venue + .venue { margin-top: 54px; padding-top: 54px; border-top: 1px solid var(--line); width: 100%; }\n\n  /* Trayecto */\n  .trayecto { background: var(--bg-2); }\n  .route {\n    background: var(--bg);\n    border: 1px solid var(--line);\n    padding: 20px 14px 14px;\n    margin: 8px auto 0;\n    max-width: 380px;\n    color: var(--ink);\n  }\n  .route svg { display: block; width: 100%; height: auto; }\n  .bus-stop .hr-note {\n    font-size: 10.5px; letter-spacing: .28em; text-transform: uppercase;\n    color: var(--muted); font-family: var(--serif);\n    text-align: right; line-height: 1.35;\n  }\n  .map-card {\n    background: var(--bg);\n    border: 1px solid var(--line);\n    padding: 14px;\n    margin-top: 10px;\n  }\n  .map-card img { width: 100%; height: auto; filter: saturate(.95); }\n\n  .bus-stops {\n    display: grid;\n    gap: 14px;\n    margin-top: 26px;\n    text-align: left;\n  }\n  .bus-stop {\n    display: grid;\n    grid-template-columns: 44px 1fr auto;\n    gap: 14px;\n    align-items: center;\n    background: var(--bg);\n    border: 1px solid var(--line);\n    padding: 14px 16px;\n  }\n  .bus-stop .ico {\n    width: 44px; height: 44px;\n    display: flex; align-items: center; justify-content: center;\n    color: var(--ink);\n  }\n  .bus-stop .ico svg { width: 28px; height: 28px; }\n  .bus-stop .town { font-size: 11px; letter-spacing: .3em; text-transform: uppercase; color: var(--muted); }\n  .bus-stop .where { font-family: var(--serif); font-size: 16px; color: var(--ink); font-style: italic; }\n  .bus-stop .hr { font-family: var(--serif); font-size: 22px; color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: .08em; }\n\n  /* RSVP */\n  .rsvp {\n    background: var(--bg);\n  }\n  .form-wrap {\n    margin-top: 16px;\n    display: grid; gap: 14px;\n    text-align: left;\n    max-width: 380px;\n    margin-left: auto; margin-right: auto;\n  }\n  .field { display: grid; gap: 6px; }\n  .field label {\n    font-size: 10.5px; letter-spacing: .3em; text-transform: uppercase; color: var(--muted);\n    font-family: var(--serif);\n  }\n  .field input, .field select, .field textarea {\n    font-family: var(--serif);\n    font-size: 16px;\n    padding: 12px 14px;\n    background: var(--bg);\n    color: var(--ink);\n    border: 1px solid var(--line);\n    border-radius: 0;\n    outline: none;\n    transition: border-color .15s;\n  }\n  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--ink); }\n  .field textarea { min-height: 72px; resize: vertical; }\n  .seg {\n    display: grid; grid-template-columns: 1fr 1fr; gap: 0;\n    border: 1px solid var(--line);\n  }\n  #busField .seg { grid-template-columns: 1fr; }\n  #busField .seg button + button { border-left: 0; border-top: 1px solid var(--line); }\n  .seg button {\n    padding: 14px 10px;\n    background: var(--bg);\n    color: var(--ink-soft);\n    border: 0;\n    font-family: var(--serif);\n    font-size: 13px; letter-spacing: .3em; text-transform: uppercase;\n    transition: background .15s, color .15s;\n  }\n  .seg button + button { border-left: 1px solid var(--line); }\n  .seg button.active { background: var(--ink); color: var(--bg); }\n  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }\n  .submit {\n    margin-top: 6px;\n    padding: 16px;\n    background: var(--ink);\n    color: var(--bg);\n    border: 0;\n    font-family: var(--serif);\n    font-size: 13px; letter-spacing: .35em; text-transform: uppercase;\n  }\n  .submit:active { transform: translateY(1px); }\n  .wa-btn {\n    margin-top: 10px;\n    display: flex; align-items: center; justify-content: center; gap: 10px;\n    padding: 14px;\n    background: transparent;\n    color: var(--ink);\n    border: 1px solid var(--ink);\n    text-decoration: none;\n    font-family: var(--serif);\n    font-size: 13px; letter-spacing: .3em; text-transform: uppercase;\n  }\n  .wa-btn svg { width: 18px; height: 18px; }\n  .thanks {\n    display: none;\n    background: var(--bg-2);\n    border: 1px solid var(--line);\n    padding: 26px;\n    text-align: center;\n    font-family: var(--serif);\n  }\n  .thanks.show { display: block; }\n  .thanks h3 {\n    font-family: var(--script);\n    font-weight: 400;\n    font-size: 34px;\n    margin: 0 0 10px;\n  }\n\n  /* Contact */\n  .contact .pair {\n    display: grid; grid-template-columns: 1fr 1fr; gap: 20px;\n    margin-top: 18px;\n  }\n  .contact .pair .who { font-family: var(--serif); font-size: 18px; color: var(--ink); margin-bottom: 6px; }\n  .contact .pair a {\n    font-family: var(--serif); font-size: 17px; letter-spacing: .05em;\n    color: var(--ink-soft); text-decoration: none; border-bottom: 1px solid var(--line);\n    padding-bottom: 2px;\n  }\n\n  /* Ornaments behind sections */\n  .orn {\n    position: absolute; pointer-events: none; opacity: 0; transition: opacity .8s;\n    z-index: 0;\n  }\n  [data-orn=\"on\"] .orn { opacity: var(--orn-op, .55); }\n  [data-orn=\"soft\"] .orn { opacity: var(--orn-op, .25); }\n  [data-orn=\"off\"] .orn { opacity: 0; }\n\n  section.block > * { position: relative; z-index: 1; }\n\n  .orn.tl { top: -10px; left: -30px; width: 180px; }\n  .orn.tr { top: 20px; right: -30px; width: 150px; transform: scaleX(-1); }\n  .orn.bl { bottom: 0; left: -20px; width: 130px; transform: scaleY(-1); }\n  .orn.br { bottom: 10px; right: -20px; width: 150px; transform: scale(-1,-1); }\n\n  /* Footer */\n  .foot {\n    text-align: center;\n    padding: 40px 24px 56px;\n    font-family: var(--serif);\n    color: var(--muted);\n    font-size: 12px;\n    letter-spacing: .3em;\n    text-transform: uppercase;\n    background: var(--bg);\n  }\n  .foot .amp { font-family: var(--script); text-transform: none; font-size: 22px; color: var(--leaf); letter-spacing: 0; display:block; margin-bottom: 6px; }\n\n  /* Audio */\n  .audio-toggle {\n    position: fixed; bottom: 16px; right: 16px;\n    width: 44px; height: 44px;\n    border-radius: 50%;\n    background: var(--bg);\n    border: 1px solid var(--line);\n    display: flex; align-items: center; justify-content: center;\n    z-index: 40;\n    color: var(--ink-soft);\n    display: none;\n  }\n  [data-music=\"on\"] .audio-toggle { display: flex; }\n\n  /* Reveal on scroll */\n  .reveal { opacity: 0; transform: translateY(20px); transition: opacity .8s ease, transform .8s ease; }\n  .reveal.in { opacity: 1; transform: none; }\n\n  /* =========== TWEAKS PANEL =========== */\n  .tweaks {\n    position: fixed;\n    right: 16px; bottom: 16px;\n    width: 300px; max-width: calc(100vw - 32px);\n    background: var(--bg);\n    color: var(--ink);\n    border: 1px solid var(--line);\n    box-shadow: 0 20px 60px rgba(0,0,0,.08), 0 2px 8px rgba(0,0,0,.04);\n    z-index: 9999;\n    font-family: var(--serif);\n    font-size: 13px;\n    display: none;\n    max-height: calc(100vh - 32px);\n    overflow-y: auto;\n  }\n  .tweaks.show { display: block; }\n  .tweaks header {\n    display: flex; align-items: center; justify-content: space-between;\n    padding: 12px 14px;\n    border-bottom: 1px solid var(--line);\n    letter-spacing: .3em; text-transform: uppercase; font-size: 11px;\n  }\n  .tweaks header button {\n    border: 0; background: transparent; color: var(--muted); font-size: 16px; line-height: 1;\n  }\n  .tweaks .tw-body { padding: 10px 14px 14px; display: grid; gap: 12px; }\n  .tw-row { display: grid; gap: 6px; }\n  .tw-row > label { font-size: 10px; letter-spacing: .3em; text-transform: uppercase; color: var(--muted); }\n  .tw-row .opts { display: flex; flex-wrap: wrap; gap: 6px; }\n  .tw-row .opts button {\n    padding: 7px 10px; font-size: 11px; letter-spacing: .15em; text-transform: uppercase;\n    border: 1px solid var(--line); background: var(--bg); color: var(--ink-soft); font-family: var(--serif);\n  }\n  .tw-row .opts button.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }\n  .tw-row .swatches { display: flex; gap: 8px; }\n  .tw-row .swatches button {\n    width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent; padding: 0;\n  }\n  .tw-row .swatches button.active { border-color: var(--ink); }\n\n  /* Responsive */\n  @media (min-width: 720px) {\n    body { background: var(--bg-2); padding: 32px 0; }\n    .page {\n      max-width: 920px;\n      box-shadow: 0 30px 80px -30px rgba(0,0,0,.18), 0 2px 12px rgba(0,0,0,.06);\n      border: 1px solid var(--line);\n    }\n    section.block { padding: 88px 64px; }\n    h2.title { font-size: 56px; }\n    .body-text { font-size: 19px; max-width: 540px; }\n    .welcome .names-big { font-size: clamp(64px, 8vw, 96px); }\n    .welcome .date-big { font-size: 26px; }\n    .welcome .places { font-size: 18px; max-width: 540px; }\n\n    /* Two-column layouts on desktop */\n    .places .venues-grid {\n      display: grid;\n      grid-template-columns: 1fr 1fr;\n      gap: 56px;\n      max-width: 760px;\n      margin: 36px auto 0;\n      align-items: start;\n    }\n    .places .venues-grid .venue + .venue {\n      margin-top: 0;\n      padding-top: 0;\n      border-top: 0;\n      border-left: 1px solid var(--line);\n      padding-left: 56px;\n    }\n\n    /* Trayecto: map left, stops right */\n    .trayecto .trayecto-grid {\n      display: grid;\n      grid-template-columns: 1.2fr 1fr;\n      gap: 48px;\n      max-width: 800px;\n      margin: 28px auto 0;\n      align-items: center;\n    }\n    .trayecto .route { margin-top: 0; }\n    .trayecto .bus-stops { margin-top: 0; }\n\n    /* Cover */\n    .cover-inner { max-width: 720px; }\n    .cover .names { font-size: clamp(72px, 10vw, 110px); }\n\n    /* Countdown bigger */\n    .count-grid { max-width: 520px; gap: 14px; }\n    .count-cell { padding: 26px 8px 22px; }\n    .count-num { font-size: 44px; }\n\n    /* RSVP form wider */\n    .form-wrap { max-width: 520px; }\n    .row-2 { grid-template-columns: 1fr 1fr; }\n\n    /* Dress code two columns */\n    .dress-grid {\n      display: grid;\n      grid-template-columns: 1fr 1fr;\n      gap: 56px;\n      max-width: 720px;\n      margin: 32px auto 0;\n      align-items: center;\n    }\n  }\n  @media (min-width: 1100px) {\n    .page { max-width: 1080px; }\n    section.block { padding: 104px 96px; }\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body data-theme=\"light\" data-script=\"parisienne\" data-orn=\"on\" data-music=\"off\">\n\n\n\n<!-- ======= COVER ======= -->\n<div class=\"cover\" id=\"cover\">\n  <div class=\"cover-inner\">\n    <di >\n            <rect x=\"3\" y=\"4\" width=\"26\" height=\"14\" rx=\"2\"><\u002Frect><path d=\"M3 10h26\"><\u002Fpath><circle cx=\"9\" cy=\"20\" r=\"2\"><\u002Fcircle><circle cx=\"23\" cy=\"20\" r=\"2\"><\u002Fcircle><path d=\"M6 7h6M20 7h6\"><\u002Fpath>\n          <\u002Fsvg>\n        <\u002Fdiv>\n        <div>\n          <div class=\"town\">Belalcázar<\u002Fdiv>\n          <div class=\"where\">Plaza del Mercado · C. del Padre Torrero, 44<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"hr hr-note\">Tras la<br>ceremonia<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fdiv>\n    <p class=\"body-text reveal\" style=\"margin-top: 22px; font-style: italic\">Por favor, avísanos en el RSVP si vas a usar el autobús.<\u002Fp>\n  <\u002Fsection>\n\n  <!-- ======= DRESS CODE ======= -->\n  <section class=\"block dresscode\">\n    <div class=\"overline reveal\">Dress code<\u002Fdiv>\n    <h2 class=\"title reveal\">Para el día<\u002Fh2>\n    <div class=\"dress-grid\">\n      <div class=\"dress-art reveal\" role=\"img\" aria-label=\"Paleta de colores sugerida\">\n        <svg viewBox=\"0 0 280 200\" xmlns=\"http://www.w3.org/2000/svg\">\n          <defs>\n            <filter id=\"rough2\" x=\"-5%\" y=\"-5%\" width=\"110%\" height=\"110%\">\n              <feTurbulence type=\"fractalNoise\" baseFrequency=\"0.85\" numOctaves=\"2\" seed=\"7\" result=\"n\"><\u002FfeTurbulence>\n              <feDisplacementMap in=\"SourceGraphic\" in2=\"n\" scale=\"1.2\"><\u002FfeDisplacementMap>\n            <\u002Ffilter>\n          <\u002Fdefs>\n          <g filter=\"url(#rough2)\">\n            <!-- color swatches arc -->\n            <g stroke=\"currentColor\" stroke-width=\".8\" fill-opacity=\".85\">\n              <circle cx=\"60\" cy=\"120\" r=\"22\" fill=\"#7a5a3a\"><\u002Fcircle>\n              <circle cx=\"100\" cy=\"92\" r=\"24\" fill=\"#9c4a3a\"><\u002Fcircle>\n              <circle cx=\"140\" cy=\"80\" r=\"26\" fill=\"#3a5a7a\"><\u002Fcircle>\n              <circle cx=\"180\" cy=\"92\" r=\"24\" fill=\"#5a7a4a\"><\u002Fcircle>\n              <circle cx=\"220\" cy=\"120\" r=\"22\" fill=\"#b69a64\"><\u002Fcircle>\n            <\u002Fg>\n            <!-- forbidden whites -->\n            <g transform=\"translate(140 165)\" stroke=\"currentColor\" stroke-width=\".9\" fill=\"none\" opacity=\".6\">\n              <circle cx=\"0\" cy=\"0\" r=\"14\" fill=\"#fbfaf6\"><\u002Fcircle>\n              <line x1=\"-11\" y1=\"-11\" x2=\"11\" y2=\"11\"><\u002Fline>\n            <\u002Fg>\n            <text x=\"140\" y=\"195\" text-anchor=\"middle\" font-family=\"Cormorant Garamond, Georgia, serif\" font-style=\"italic\" font-size=\"11\" fill=\"currentColor\" opacity=\".55\">sin tonos blancos<\u002Ftext>\n          <\u002Fg>\n        <\u002Fsvg>\n      <\u002Fdiv>\n      <div>\n        <p class=\"body-text reveal\" style=\"font-style: italic; font-size: 20px; color: var(--ink);\">\n          Nos encantará veros elegantes y llenos de color.\n        <\u002Fp>\n        <p class=\"body-text reveal\" style=\"margin-top: 14px;\">\n          Os agradecemos evitar tonos claros similares al blanco.\n        <\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ======= RSVP ======= -->\n  <section class=\"block rsvp\" id=\"rsvp\">\n    \n    \n\n    <div class=\"overline reveal\">Confirma tu asistencia<\u002Fdiv>\n    <h2 class=\"title reveal\">¿Vendrás?<\u002Fh2>\n    <p class=\"body-text reveal\">Nos encantaría contar contigo. Confírmanos antes del <b style=\"font-weight:500\">15 de junio<\u002Fb>.<\u002Fp>\n\n    <form class=\"form-wrap reveal\" id=\"rsvpForm\" autocomplete=\"off\">\n      <div class=\"field\">\n        <label>Nombre completo<\u002Flabel>\n        <input type=\"text\" name=\"nombre\" required=\"\" placeholder=\"Tu nombre\">\n      <\u002Fdiv>\n      <div class=\"field\">\n        <label>¿Asistirás?<\u002Flabel>\n        <div class=\"seg\" role=\"radiogroup\">\n          <button type=\"button\" data-attend=\"si\">Sí, allí estaré<\u002Fbutton>\n          <button type=\"button\" data-attend=\"no\">No podré<\u002Fbutton>\n        <\u002Fdiv>\n        <input type=\"hidden\" name=\"attend\" value=\"\">\n      <\u002Fdiv>\n      <div class=\"field\" id=\"moreFields\">\n        <label>Acompañantes (además de ti)<\u002Flabel>\n        <select name=\"acompanantes\">\n            <option>0<\u002Foption><option>1<\u002Foption><option>2<\u002Foption><option>3<\u002Foption><option>4<\u002Foption><option>5<\u002Foption><option>6<\u002Foption>\n          <\u002Fselect>\n      <\u002Fdiv>\n      <div class=\"field\" id=\"busField\">\n        <label>¿Usarás el autobús?<\u002Flabel>\n        <div class=\"seg\" role=\"radiogroup\">\n          <button type=\"button\" data-bus=\"hinojosa\">Hinojosa · 18:10<\u002Fbutton>\n          <button type=\"button\" data-bus=\"belalcazar\">Belalcázar · tras ceremonia<\u002Fbutton>\n          <button type=\"button\" data-bus=\"no\">No lo usaré<\u002Fbutton>\n        <\u002Fdiv>\n        <input type=\"hidden\" name=\"bus\" value=\"\">\n      <\u002Fdiv>\n      <div class=\"field\">\n        <label>Alergias o notas<\u002Flabel>\n        <textarea name=\"notas\" placeholder=\"Algo que debamos saber (opcional)\"><\u002Ftextarea>\n      <\u002Fdiv>\n      <button class=\"submit\" type=\"submit\">Confirmar<\u002Fbutton>\n      <\u002Fform>\n\n    <div class=\"thanks\" id=\"thanks\">\n      <h3>¡Gracias!<\u002Fh3>\n      <p class=\"body-text\" style=\"margin: 8px auto 0;\">Hemos anotado tu respuesta.<br>Nos vemos el 4 de julio.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ======= CONTACT ======= -->\n  <section class=\"block contact\">\n    <div class=\"overline reveal\">Cualquier duda<\u002Fdiv>\n    <h2 class=\"title reveal\">Habla con nosotros<\u002Fh2>\n    <div class=\"pair reveal\">\n      <div>\n        <div class=\"who\">Ángela<\u002Fdiv>\n        <a href=\"tel:+34637181927\">637 18 19 27<\u002Fa>\n      <\u002Fdiv>\n      <div>\n        <div class=\"who\">Javier<\u002Fdiv>\n        <a href=\"tel:+34630437643\">630 43 76 43<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <div class=\"foot\">\n    <span class=\"amp\">Á &amp; J<\u002Fspan>\n    Con amor · 4 · VII · 2026\n  <\u002Fdiv>\n<\u002Fmain>\n\n<button class=\"audio-toggle\" id=\"audioToggle\" aria-label=\"Música\">\n  <svg viewBox=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 18V5l12-2v13\"><\u002Fpath><circle cx=\"6\" cy=\"18\" r=\"3\"><\u002Fcircle><circle cx=\"18\" cy=\"16\" r=\"3\"><\u002Fcircle><\u002Fsvg>\n<\u002Fbutton>\n\n<!-- ======= TWEAKS PANEL ======= -->\n<div class=\"tweaks\" id=\"tweaks\">\n  <header>\n    <span>Tweaks<\u002Fspan>\n    <button id=\"twClose\" aria-label=\"Cerrar\">×<\u002Fbutton>\n  <\u002Fheader>\n  <div class=\"tw-body\">\n    <div class=\"tw-row\">\n      <label>Paleta<\u002Flabel>\n      <div class=\"swatches\" id=\"swPalette\">\n        <button data-leaf=\"#9fa987\" style=\"background:#9fa987\" title=\"Salvia\"><\u002Fbutton>\n        <button data-leaf=\"#b69a64\" style=\"background:#b69a64\" title=\"Dorado\"><\u002Fbutton>\n        <button data-leaf=\"#c8a2a2\" style=\"background:#c8a2a2\" title=\"Rosa empolvado\"><\u002Fbutton>\n        <button data-leaf=\"#7a8a9c\" style=\"background:#7a8a9c\" title=\"Azul polvo\"><\u002Fbutton>\n        <button data-leaf=\"#3a3a38\" style=\"background:#3a3a38\" title=\"Neutro\"><\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"tw-row\">\n      <label>Tipografía script<\u002Flabel>\n      <div class=\"opts\" id=\"swScript\">\n        <button data-val=\"parisienne\">Parisienne<\u002Fbutton>\n        <button data-val=\"dancing\">Dancing<\u002Fbutton>\n        <button data-val=\"vibes\">Great Vibes<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"tw-row\">\n      <label>Modo<\u002Flabel>\n      <div class=\"opts\" id=\"swTheme\">\n        <button data-val=\"light\">Claro<\u002Fbutton>\n        <button data-val=\"dark\">Oscuro<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"tw-row\">\n      <label>Copy de portada<\u002Flabel>\n      <div class=\"opts\" id=\"swCopy\">\n        <button data-val=\"a\">Nos casamos<\u002Fbutton>\n        <button data-val=\"b\">Save the date<\u002Fbutton>\n        <button data-val=\"c\">Una invitación<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- =========== SCRIPTS =========== -->\n<script>\n/* ===== Tweak defaults (persistable) ===== */\nconst TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{\n  \"palette\": \"#7a8a9c\",\n  \"script\": \"parisienne\",\n  \"ornaments\": \"soft\",\n  \"theme\": \"light\",\n  \"coverCopy\": \"a\"\n}/*EDITMODE-END*/;\n\nlet tweaks = {...TWEAK_DEFAULTS};\n\n/* ===== Cover open ===== */\nconst cover = document.getElementById('cover');\nconst openBtn = document.getElementById('openBtn');\nfunction openInvite() {\n  cover.classList.add('open');\n  setTimeout(() => { cover.style.display = 'none'; }, 1400);\n  // start reveal observer after cover is gone\n  setTimeout(startReveal, 100);\n}\nopenBtn.addEventListener('click', openInvite);\n// swipe up to open\nlet touchStartY = null;\ncover.addEventListener('touchstart', e => { touchStartY = e.touches[0].clientY; }, {passive:true});\ncover.addEventListener('touchend', e => {\n  if (touchStartY == null) return;\n  const dy = touchStartY - (e.changedTouches[0].clientY);\n  if (dy > 40) openInvite();\n  touchStartY = null;\n}, {passive:true});\n\n/* ===== Countdown ===== */\nconst WEDDING = new Date('2026-07-04T19:00:00+02:00');\nfunction tick() {\n  const now = new Date();\n  let diff = Math.max(0, WEDDING - now);\n  const d = Math.floor(diff / 86400000); diff -= d*86400000;\n  const h = Math.floor(diff / 3600000);  diff -= h*3600000;\n  const m = Math.floor(diff / 60000);    diff -= m*60000;\n  const s = Math.floor(diff / 1000);\n  const pad = n => String(n).padStart(2,'0');\n  document.querySelector('[data-c=\"d\"]').textContent = pad(d);\n  document.querySelector('[data-c=\"h\"]').textContent = pad(h);\n  document.querySelector('[data-c=\"m\"]').textContent = pad(m);\n  document.querySelector('[data-c=\"s\"]').textContent = pad(s);\n}\ntick(); setInterval(tick, 1000);\n\n/* ===== Reveal on scroll ===== */\nfunction startReveal() {\n  const io = new IntersectionObserver(entries => {\n    entries.forEach(e => {\n      if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }\n    });\n  }, {threshold: 0.15});\n  document.querySelectorAll('.reveal').forEach(el => io.observe(el));\n}\n\n/* ===== Segmented buttons ===== */\ndocument.querySelectorAll('[data-attend]').forEach(btn => {\n  btn.addEventListener('click', () => {\n    btn.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('active'));\n    btn.classList.add('active');\n    document.querySelector('input[name=\"attend\"]').value = btn.dataset.attend;\n    const show = btn.dataset.attend === 'si';\n    document.getElementById('moreFields').style.display = show ? '' : 'none';\n    document.getElementById('busField').style.display = show ? '' : 'none';\n  });\n});\ndocument.querySelectorAll('[data-bus]').forEach(btn => {\n  btn.addEventListener('click', () => {\n    btn.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('active'));\n    btn.classList.add('active');\n    document.querySelector('input[name=\"bus\"]').value = btn.dataset.bus;\n  });\n});\n\n\n/* ===== Form submit \u2192 Google Sheets ===== */\ndocument.getElementById('rsvpForm').addEventListener('submit', async e => {\n  e.preventDefault();\n  const form = e.target;\n  const btn = form.querySelector('.submit');\n  btn.disabled = true;\n  btn.textContent = 'Enviando\u2026';\n  const data = {\n    nombre: form.nombre.value,\n    attend: form.attend.value,\n    acompanantes: form.acompanantes ? form.acompanantes.value : '0',\n    bus: form.bus.value,\n    notas: form.notas.value\n  };\n  try {\n    await fetch('https://script.google.com/macros/s/AKfycbzT_PfAfNkwY8pS67gWu_3sNaR8EHDnYISE7Bz6fkxgoe78ot26pRomTZfcw97yGHVo/exec', {\n      method: 'POST',\n      mode: 'no-cors',\n      body: JSON.stringify(data)\n    });\n  } catch(_) {}\n  form.style.display = 'none';\n  const t = document.getElementById('thanks');\n  t.classList.add('show');\n});\n\n/* ===== Apply tweaks ===== */\nfunction applyTweaks() {\n  document.body.dataset.theme = tweaks.theme;\n  document.body.dataset.script = tweaks.script;\n  document.body.dataset.orn = tweaks.ornaments;\n  document.documentElement.style.setProperty('--leaf', tweaks.palette);\n\n  // cover copy\n  const meta = document.querySelector('.cover .meta');\n  const hint = document.querySelector('.cover .hint');\n  if (tweaks.coverCopy === 'a') { meta.textContent = 'Nos casamos'; }\n  if (tweaks.coverCopy === 'b') { meta.textContent = 'Save the date'; }\n  if (tweaks.coverCopy === 'c') { meta.textContent = 'Una invitación'; }\n\n  // sync UI\n  syncTweakUI();\n}\nfunction syncTweakUI() {\n  const setActive = (sel, val, attr) => {\n    document.querySelectorAll(sel + ' button').forEach(b => {\n      b.classList.toggle('active', b.getAttribute(attr) === val);\n    });\n  };\n  setActive('#swPalette', tweaks.palette, 'data-leaf');\n  setActive('#swScript', tweaks.script, 'data-val');\n  setActive('#swTheme', tweaks.theme, 'data-val');\n  setActive('#swCopy', tweaks.coverCopy, 'data-val');\n}\napplyTweaks();\n\n/* ===== Tweak panel bindings ===== */\ndocument.querySelectorAll('#swPalette button').forEach(b => b.addEventListener('click', () => setTweak({palette: b.dataset.leaf})));\ndocument.querySelectorAll('#swScript button').forEach(b => b.addEventListener('click', () => setTweak({script: b.dataset.val})));\ndocument.querySelectorAll('#swTheme button').forEach(b => b.addEventListener('click', () => setTweak({theme: b.dataset.val})));\ndocument.querySelectorAll('#swCopy button').forEach(b => b.addEventListener('click', () => setTweak({coverCopy: b.dataset.val})));\n\nfunction setTweak(edits) {\n  Object.assign(tweaks, edits);\n  applyTweaks();\n  window.parent.postMessage({type: '__edit_mode_set_keys', edits}, '*');\n}\n\n/* ===== Edit mode protocol ===== */\nwindow.addEventListener('message', e => {\n  const d = e.data || {};\n  if (d.type === '__activate_edit_mode') document.getElementById('tweaks').classList.add('show');\n  if (d.type === '__deactivate_edit_mode') document.getElementById('tweaks').classList.remove('show');\n});\ndocument.getElementById('twClose').addEventListener('click', () => {\n  document.getElementById('tweaks').classList.remove('show');\n});\nwindow.parent.postMessage({type: '__edit_mode_available'}, '*');\n\n/* ===== Start reveal even if cover autoskipped ===== */\nif (cover.style.display === 'none') startReveal();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
